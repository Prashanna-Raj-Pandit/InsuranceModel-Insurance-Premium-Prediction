<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Insurance Premium Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #e5e7e8
        }
        .container {
            display: flex;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            gap: 20px;
        }
        .form-section {
            flex: 1;
            max-width: 500px;
            text-align: center;
        }
        .notebook-section {
            flex: 1;
            max-width: 700px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-weight: bold;
        }
        input, select {
            padding: 8px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .prediction {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
        }
        .error {
            color: red;
        }
        iframe {
            width: 100%;
            height: 80vh;
            border: 1px solid #ccc;
        }
        .notebook-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .notebook-header h2 {
            margin: 0;
            font-size: 24px;
        }
        .colab-button img {
            height: 25px; /* Matches Colab badge size */
            vertical-align: middle;
        }
        .more-models-button {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px; /* Reduced padding */
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 12px; /* Smaller text */
            transition: transform 0.2s;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Insurance Premium Calculator</h1>
    <div class="container">
        <!-- Form Section -->
        <div class="form-section">
            <form method="POST" action="/predict">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" min="0" required>

                <label for="sex">Sex:</label>
                <select id="sex" name="sex" required>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                </select>

                <label for="bmi">BMI:</label>
                <input type="number" id="bmi" name="bmi" step="0.1" min="0" required>

                <label for="children">Number of Children:</label>
                <input type="number" id="children" name="children" min="0" required>

                <label for="smoker">Smoker:</label>
                <select id="smoker" name="smoker" required>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>

                <label for="region">Region:</label>
                <select id="region" name="region" required>
                    <option value="southwest">Southwest</option>
                    <option value="southeast">Southeast</option>
                    <option value="northwest">Northwest</option>
                    <option value="northeast">Northeast</option>
                </select>

                <button type="submit">Calculate Premium</button>
            </form>

            {% if prediction_text %}
                <div class="prediction {% if 'Error' in prediction_text %}error{% endif %}">
                    {{ prediction_text }}
                </div>
            {% endif %}
        </div>

        <!-- Notebook Section -->
        <div class="notebook-section">
            <div class="notebook-header">
                <h2>Model Development Process</h2>
                <a href="https://colab.research.google.com/github/Prashanna-Raj-Pandit/Neural-Net-Regression/blob/main/02_NN_Regression_Insurance.ipynb"
                   class="colab-button" target="_blank">
                    <img src="https://colab.research.google.com/assets/colab-badge.svg" alt="Open in Colab">
                </a>
                <a href="https://github.com/Prashanna-Raj-Pandit/Neural-Net-Regression"
                       class="more-models-button" target="_blank">
                        View More ML Models
                </a>
            </div>
            <iframe src="{{ url_for('static', filename='insurance_model.html') }}"></iframe>
        </div>
    </div>
</body>
</html>
